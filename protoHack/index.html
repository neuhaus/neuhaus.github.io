<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>protoHack — Fenlason Hack (1982)</title>
    <link rel="stylesheet" href="./xterm.css" />
    <style>
      :root{color-scheme:dark}body{background:#0c0c0c;color:#ccc;font-family:monospace;margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{text-align:center;padding:12px 16px 4px}header h1{font-size:16px;margin:0 0 4px;font-weight:normal}#terminal{border:1px solid #333;padding:4px;background:#000}#files{font-size:12px;color:#888;padding:8px 16px 0}#status{font-size:12px;color:#888;padding:8px 16px 16px;text-align:center;max-width:720px}
    </style>
  </head>
  <body>
    <header>
      <h1>protoHack — Fenlason Hack (1982)</h1>
    </header>
    <div id="terminal"></div>
    <div id="files"></div>
    <div id="status"></div>
    <script src="./xterm.js"></script>
    <script type="module">
      import { openpty } from "./xterm-pty.js";
      import initEmscripten from "./hack.js";
      import { createStorageManager } from "./storage.js";

      const term = new Terminal({ cols: 80, rows: 24 });
      term.open(document.getElementById("terminal"));
      term.focus();
      term.element.addEventListener("click", () => term.focus());

      // PTY layer between xterm.js and the Emscripten program: line
      // discipline, termios ioctls, window size and Ctrl+C handling.
      const { master: leader, slave: follower } = openpty();
      term.loadAddon(leader);

      const storage = createStorageManager({
        filesElement: document.getElementById("files"),
        statusElement: document.getElementById("status"),
      });

      try {
        const program = await initEmscripten(storage.options({
          pty: follower,
          persist: true,
          persistDir: "/protohack-save",
        }));
        storage.attach(program);
      } catch (e) {
        storage.fail(e);
      }
    </script>
  </body>
</html>
