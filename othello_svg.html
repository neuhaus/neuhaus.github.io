<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Othello Board</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

.container {
  text-align: center;
}

h1 {
  color: #333;
  margin-bottom: 20px;
}

svg {
  max-width: 100%;
  height: auto;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}


  </style>
</head>
<body>
  <div class="container">
    <h1>Othello</h1>

<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .A { --x: 0px; }
    .B { --x: 50px; }
    .C { --x: 100px; }
    .D { --x: 150px; }
    .E { --x: 200px; }
    .F { --x: 250px; }
    .G { --x: 300px; }
    .H { --x: 350px; }
    
    ._1 { --y: 0px; }
    ._2 { --y: 50px; }
    ._3 { --y: 100px; }
    ._4 { --y: 150px; }
    ._5 { --y: 200px; }
    ._6 { --y: 250px; }
    ._7 { --y: 300px; }
    ._8 { --y: 350px; }
    
    use {
      transform: translate(var(--x, 0px), var(--y, 0px));
    }
  </style>
  
  <defs>
    <rect id="empty" width="50" height="50" fill="green" stroke="black"/>
    <circle id="white" cx="25" cy="25" r="20" fill="white" stroke="black"/>
    <circle id="black" cx="25" cy="25" r="20" fill="black" stroke="white"/>
  </defs>
  
  <!-- Board -->
  <g id="board">
    <use href="#empty" class="A _1"/><use href="#empty" class="B _1"/><use href="#empty" class="C _1"/><use href="#empty" class="D _1"/><use href="#empty" class="E _1"/><use href="#empty" class="F _1"/><use href="#empty" class="G _1"/><use href="#empty" class="H _1"/>
    <use href="#empty" class="A _2"/><use href="#empty" class="B _2"/><use href="#empty" class="C _2"/><use href="#empty" class="D _2"/><use href="#empty" class="E _2"/><use href="#empty" class="F _2"/><use href="#empty" class="G _2"/><use href="#empty" class="H _2"/>
    <use href="#empty" class="A _3"/><use href="#empty" class="B _3"/><use href="#empty" class="C _3"/><use href="#empty" class="D _3"/><use href="#empty" class="E _3"/><use href="#empty" class="F _3"/><use href="#empty" class="G _3"/><use href="#empty" class="H _3"/>
    <use href="#empty" class="A _4"/><use href="#empty" class="B _4"/><use href="#empty" class="C _4"/><use href="#empty" class="D _4"/><use href="#empty" class="E _4"/><use href="#empty" class="F _4"/><use href="#empty" class="G _4"/><use href="#empty" class="H _4"/>
    <use href="#empty" class="A _5"/><use href="#empty" class="B _5"/><use href="#empty" class="C _5"/><use href="#empty" class="D _5"/><use href="#empty" class="E _5"/><use href="#empty" class="F _5"/><use href="#empty" class="G _5"/><use href="#empty" class="H _5"/>
    <use href="#empty" class="A _6"/><use href="#empty" class="B _6"/><use href="#empty" class="C _6"/><use href="#empty" class="D _6"/><use href="#empty" class="E _6"/><use href="#empty" class="F _6"/><use href="#empty" class="G _6"/><use href="#empty" class="H _6"/>
    <use href="#empty" class="A _7"/><use href="#empty" class="B _7"/><use href="#empty" class="C _7"/><use href="#empty" class="D _7"/><use href="#empty" class="E _7"/><use href="#empty" class="F _7"/><use href="#empty" class="G _7"/><use href="#empty" class="H _7"/>
    <use href="#empty" class="A _8"/><use href="#empty" class="B _8"/><use href="#empty" class="C _8"/><use href="#empty" class="D _8"/><use href="#empty" class="E _8"/><use href="#empty" class="F _8"/><use href="#empty" class="G _8"/><use href="#empty" class="H _8"/>
  </g>
  
  <!-- Starting position -->
  <use href="#white" class="D _4"/>
  <use href="#black" class="E _4"/>
  <use href="#black" class="D _5"/>
  <use href="#white" class="E _5"/>
</svg>

  </div>
</body>
</html>
